ew", "Present MSc project with measured results", "Verify placement eligibility with placement cell"]]},S=[{"name": "Python programming", "items": ["Python basics \u2014 Variables, data types, loops, conditionals, functions", "Lists, dicts, sets, tuples \u2014 Indexing, slicing, comprehensions, nested structures", "File handling & exceptions \u2014 Read/write CSV, JSON, try-except blocks", "OOP basics \u2014 Classes, objects, inheritance, encapsulation", "NumPy \u2014 Arrays, broadcasting, vectorised operations, reshape", "Pandas \u2014 DataFrame, groupby, merge, pivot, apply, loc/iloc", "Matplotlib & Seaborn \u2014 Line, bar, histogram, heatmap, pairplot, styling", "Plotly / interactive charts \u2014 Dynamic plots, dashboards, hover tooltips", "DSA basics in Python \u2014 Arrays, strings, recursion, stacks, queues, linked lists", "LeetCode easy problems \u2014 Two pointers, sliding window, hash maps \u2014 50 problems"]}, {"name": "SQL & databases", "items": ["SELECT, WHERE, ORDER BY \u2014 Filtering, sorting, DISTINCT, LIMIT, aliases \u2014 write 20 queries to get fast", "GROUP BY & aggregate functions \u2014 COUNT, SUM, AVG, MIN, MAX, HAVING \u2014 most common filter-round question type", "JOINs \u2014 INNER, LEFT, RIGHT, FULL OUTER, SELF JOIN \u2014 draw the Venn diagram for each, then code", "Subqueries & CTEs \u2014 Nested SELECT, WITH clause, correlated subqueries \u2014 when to use CTE vs subquery", "Window functions \u2014 ROW_NUMBER, RANK, DENSE_RANK, LAG, LEAD, PARTITION BY \u2014 Tiger tests this heavily", "String & date functions \u2014 SUBSTRING, CONCAT, DATEDIFF, DATE_FORMAT, EXTRACT \u2014 common in Zoho rounds", "NULL handling \u2014 IS NULL, COALESCE, NULLIF \u2014 how NULLs behave in JOINs and aggregations", "CASE statements \u2014 Conditional logic in SQL \u2014 CASE WHEN THEN ELSE END used in every real query", "Indexing & query optimisation \u2014 Why indexes matter, EXPLAIN plan, slow query basics", "Database design basics \u2014 Normalisation ofile & competitions \u2014 Complete at least 2 competitions, get a bronze \u2014 shows you can handle real messy data", "Domain-specific project \u2014 One project in a business domain: retail, finance, or healthcare \u2014 Tiger Analytics loves domain depth"]}, {"name": "Data analysis & visualisation", "items": ["EDA process \u2014 Shape, nulls, types, distributions, outliers, correlations", "Storytelling with data \u2014 Choosing right chart, annotation, insight-first communication", "Tableau basics \u2014 Connect data, build charts, create dashboard, filters, calculated fields", "Power BI basics \u2014 Load data, DAX basics, slicers, publish report", "Excel advanced \u2014 VLOOKUP, pivot tables, conditional formatting, dashboards", "Business metrics \u2014 DAU/MAU, churn, retention, NPS, conversion rate, LTV", "Case study practice \u2014 10 business cases: sales drop, churn spike, product launch analysis"]}, {"name": "Git & version control", "items": ["Git core concepts \u2014 What is version control, why it matters \u2014 repository vs working directory vs staging area", "Essential Git commands \u2014 git init, clone, add, commit, status, log, diff \u2014 use these every single day", "Branching & merging \u2014 git branch, checkout, switch, merge, rebase \u2014 feature branch workflow", "Remote repositories \u2014 git remote, push, pull, fetch \u2014 origin, upstream, tracking branches explained", "Resolving merge conflicts \u2014 What causes conflicts, how to read conflict markers, how to resolve and commit", "GitHub portfolio setup \u2014 Profile README, pin your DS projects, write good repo READMEs with results & screenshots", "Pull requests & code review \u2014 Fork \u2192 branch \u2192 PR workflow, writing PR descriptions, responding to review comments", ".gitignore & best practices \u2014 Ignore venv, .env, __pycache__, large data files \u2014 keep repos clean and professional", "Git for data science projects \u2014 Version notebooks, use nbstripout, trac ng and searching, with time and space complexity", "Trees and graphs: BFS, DFS, binary search tree basics", "Recursion and simple dynamic programming", "Solve 3 problems in 90 minutes on HackerRank or a similar platform", "Java basics: classes, collections, exceptions, string handling"]}, {"name": "Core computer science for IT interviews", "items": ["Database design: normalisation, keys, ER diagrams", "Indexing and query optimisation", "Transactions, ACID properties, isolation levels", "OOP for interviews: polymorphism, abstraction, overloading vs overriding, interface vs abstract class", "Operating systems: processes vs threads, scheduling, deadlock, paging", "Computer networks: OSI and TCP/IP layers, HTTP, DNS, IP addressing", "Software engineering: SDLC, Agile and Scrum, types of testing", "Linux command line basics", "Git essentials: commit, branch, merge, push, pull, conflicts", "REST APIs, JSON and a small Flask API", "Cloud basics: AWS or GCP storage and compute", "Docker basics (concept)", "Basic HTML, CSS and JavaScript awareness"]}, {"name": "SQL", "items": ["SELECT, WHERE, ORDER BY, GROUP BY, HAVING and aggregates", "JOINs: inner, left, right, full, self", "Subqueries and CTEs", "Window functions: ROW_NUMBER, RANK, DENSE_RANK, LAG, LEAD", "String, date and NULL functions, CASE statements", "Practice sets: DataLemur 50 and LeetCode SQL 30", "Classic questions: Nth highest salary, find duplicates, employees earning more than their manager"]}, {"name": "Statistics and mathematics", "items": ["Descriptive statistics: mean, median, variance, skewness", "Probability basics and Bayes theorem", "Distributions: normal, binomial, Poisson, uniform", "Hypothesis testing: p-value, Type I and II errors, t-test, chi-square", "Confidence intervals", "Correlation and regression: Pearson, Spearman, linear regression", "A/B testing", "Linear algebra: vectors, matrices, eigenvalues", "Calculus for gradients and backpropagation", "Assumptions behind linear regression and how file README and pinned projects", "Cut your resume to skills you can defend: expect three follow-up questions on each line", "Prepare your MSc project or internship as a five-minute story"]}, {"name": "Interview and HR rounds", "items": ["Tell me about yourself: 60 seconds", "STAR stories: prepare five", "Why this company: research the recruiters visiting SASTRA", "Common HR questions: strengths, weaknesses, five-year plan, handling failure", "Technical interview format for each company", "Explain a model to a non-technical person", "Mock interviews: record yourself or practise with a friend", "Salary negotiation basics", "Group discussion practice: opening, structure, summarising", "Attend every placement cell training session on aptitude, resume and interviews"]}, {"name": "Placement cell and eligibility checks", "items": ["Register with the SASTRA Training and Placement department for the placement process", "Ask the placement cell for the written PG placement rules, and which graduating batch they count you in", "Confirm your programme (Thanjavur, Chennai or online) sits the same campus drives", "Check for zero active arrears before every drive", "Keep scans of X, XII, degree, IITM diploma and every semester marksheet in one folder", "Check each drive's percentage bar against your X, XII, UG and PG marks", "Read the age and gap rules in each notice (2026 notices: TCS up to 28, Cognizant GenC up to 30, gap up to 2 years)", "Register on the TCS NQT, Infosys, Wipro and Cognizant portals as an off-campus backup"]}];let state={done:{},notes:{}};try{state=JSON.parse(localStorage.getItem('placement-hub-v2'))||state}catch(e){};let view='Subjects';const root=document.querySelector('#root'),search=document.querySelector('#search');const levels=['Fundamentals','Intermediate (Medium)','Real-world working area'];function save(){try{localStorage.setItem('placement-hub-v2',JSON.stringify(state));document.querySelector('#storage').textContent='Saved locally in this browser'}catch(e){document.querySelector('#storage').textContent='Local saving unavailable; export backup'}}function el(t,txt,parent){const x=document.createElement(t);if(txt)x.textContent=txt;if(parent)parent.append(x);return x}function total(){return Object.values(D).flat(2).length+S.reduce((n,s)=>n+s.items.length,0)}function stats(){let n=Object.keys(state.done).filter(k=>state.done[k]).length;document.querySelector('#stats').textContent=n+' / '+total()+' tasks complete';document.querySelector('#progress').value=100*n/total()}function tick(parent,t,k){let l=el('label','',parent),c=el('input','',l);c.type='checkbox';c.checked=!!state.done[k];el('span',t,l);c.onchange=()=>{state.done[k]=c.checked;save();stats()}}function render(){root.replaceChildren();let q=search.value.toLowerCase();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent===view));if(view==='Mind map'){let a=el('article','',root);el('h2','Placement readiness → choose a subject',a);let g=el('div','',a);g.className='map';Object.keys(D).forEach(n=>{let b=el('button',n,g);b.onclick=()=>{view='Subjects';search.value=n;render()}})}else if(view==='Roadmap'){let a=el('article','',root);el('h2','24-week roadmap',a);['Weeks 1–4: Python, DSA, Git and aptitude','Weeks 5–8: OS, networks, DBMS and SQL','Weeks 9–12: Mathematics, statistics and data analysis','Weeks 13–16: Machine learning and practical cases','Weeks 17–20: Deep learning, GenAI, big data and deployment','Weeks 21–24: Projects, revision and mock interviews'].forEach(t=>el('p',t,a))}else if(view==='Source checklists'){S.forEach((s,i)=>{let items=s.items.filter(t=>(s.name+t).toLowerCase().includes(q));if(!items.length)return;let a=el('article','',root);el('h2',s.name,a);items.forEach(t=>tick(a,t,'src:'+i+':'+s.items.indexOf(t)))})}else{Object.entries(D).forEach(([n,groups])=>{if(!(n+groups.flat().join(' ')).toLowerCase().includes(q))return;let a=el('article','',root);el('h2',n,a);let g=el('div','',a);g.className='cols';groups.forEach((items,i)=>{let c=el('section','',g);c.className='level';el('h3',levels[i],c);items.forEach((t,j)=>tick(c,t,n+':'+i+':'+j));let note=el('textarea','',c);note.placeholder='Notes, practice links, interview questions…';note.value=state.notes[n+':'+i]||'';note.oninput=()=>{state.notes[n+':'+i]=note.value;save()}})})}stats()}['Subjects','Roadmap','Mind map','Source checklists'].forEach(v=>{let b=el('button',v,document.querySelector('#nav'));b.onclick=()=>{view=v;search.value='';render()}});search.oninput=render;document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='placement-progress.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#import').onchange=async e=>{try{let s=JSON.parse(await e.target.files[0].text());if(!s.done||!s.notes)throw Error();state=s;save();render()}catch(e){alert('Invalid backup')}};render();</script></html>
